<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>다점</title>
</head>
<body>

<header>
    <h1>다점</h1>

    <nav th:if="${!loggedIn}">
        <a th:href="@{/login}">로그인</a>
        <a th:href="@{/signup}">회원가입</a>
    </nav>

    <nav th:if="${loggedIn}">
        <a th:href="@{/saju/input}">AI 사주</a>

        <form th:action="@{/logout}"
              method="post">
            <button type="submit">로그아웃</button>
        </form>
    </nav>
</header>

<main>
    <h2>AI로 풀어보는 나의 사주</h2>
    <p>
        생년월일과 태어난 시간을 바탕으로
        사주팔자를 계산하고 AI가 해석합니다.
    </p>

    <a th:if="${loggedIn}"
       th:href="@{/saju/input}">
        사주 보러 가기
    </a>

    <a th:if="${!loggedIn}"
       th:href="@{/signup}">
        시작하기
    </a>
</main>

</body>
</html>

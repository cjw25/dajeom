<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>사주 정보 입력 | 다점</title>
</head>
<body>

<header>
  <a th:href="@{/}">다점</a>

  <form th:action="@{/logout}"
        method="post">
    <button type="submit">로그아웃</button>
  </form>
</header>

<main>
  <h1>사주 정보 입력</h1>

  <p>
    정확한 사주팔자 계산을 위해
    출생 정보를 입력해 주세요.
  </p>

  <!-- 다음 단계에서 실제 BirthProfile DTO와 연결 -->
  <form>
    <div>
      <label for="name">이름</label>
      <input id="name"
             type="text"
             autocomplete="name">
    </div>

    <div>
      <span>성별</span>

      <label>
        <input type="radio"
               name="gender"
               value="MALE">
        남성
      </label>

      <label>
        <input type="radio"
               name="gender"
               value="FEMALE">
        여성
      </label>
    </div>

    <div>
      <span>달력 구분</span>

      <label>
        <input type="radio"
               name="calendarType"
               value="SOLAR"
               checked>
        양력
      </label>

      <label>
        <input type="radio"
               name="calendarType"
               value="LUNAR">
        음력
      </label>
    </div>

    <div>
      <label for="birthDate">생년월일</label>
      <input id="birthDate"
             type="date">
    </div>

    <div>
      <label for="birthTime">태어난 시간</label>
      <input id="birthTime"
             type="time">
    </div>

    <label>
      <input type="checkbox">
      태어난 시간을 모릅니다
    </label>

    <button type="button" disabled>
      사주 분석하기
    </button>
  </form>
</main>

</body>
</html>

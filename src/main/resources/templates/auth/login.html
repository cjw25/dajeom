<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>로그인 | 다점</title>
</head>
<body>

<main>
  <h1>로그인</h1>

  <p th:if="${signupSuccess}"
     th:text="${signupSuccess}">
  </p>

  <p th:if="${param.error}">
    이메일 또는 비밀번호가 올바르지 않습니다.
  </p>

  <p th:if="${param.logout}">
    로그아웃되었습니다.
  </p>

  <form th:action="@{/login}"
        method="post">

    <div>
      <label for="email">이메일</label>
      <input id="email"
             name="email"
             type="email"
             autocomplete="email"
             required>
    </div>

    <div>
      <label for="password">비밀번호</label>
      <input id="password"
             name="password"
             type="password"
             autocomplete="current-password"
             required>
    </div>

    <button type="submit">로그인</button>
  </form>

  <a th:href="@{/signup}">
    회원가입
  </a>
</main>

</body>
</html>

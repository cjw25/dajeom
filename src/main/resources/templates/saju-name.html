<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#07101f">

    <title>이름 입력 - AI 사주</title>

    <link rel="stylesheet"
          th:href="@{/css/saju-name.css}"
          href="/css/saju-name.css">
</head>

<body>

<div class="name-app">

    <header class="name-header">

        <button type="button"
                class="header-control"
                id="backButton"
                aria-label="이전 화면">

            <span class="back-icon">
                ‹
            </span>

        </button>

        <div class="progress-area">

            <span class="progress-text">
                기본정보 1 / 3
            </span>

            <div class="progress-track">

                <div class="progress-value"></div>

            </div>

        </div>

        <button type="button"
                class="header-control"
                id="homeButton"
                aria-label="홈으로 이동">

            ⌂

        </button>

    </header>

    <main class="name-main">

        <section class="character-area">

            <img th:src="@{/img/saju-character.png}"
                 src="/img/saju-character.png"
                 class="character-image"
                 alt="AI 사주 상담 캐릭터">

            <div class="character-overlay"></div>

            <div class="speech-bubble">

                <span class="speech-name">
                    관상선생
                </span>

                <p>
                    상담에서 불러드릴<br>
                    이름이 무엇인가요?
                </p>

            </div>

        </section>

        <section class="form-section">

            <div class="form-heading">

                <span class="step-label">
                    STEP 01
                </span>

                <h1>이름을 알려주세요</h1>

                <p>
                    실명이나 상담에서 사용할 이름을 입력할 수 있습니다.
                </p>

            </div>

            <form id="nameForm"
                  novalidate>

                <label for="nameInput"
                       class="input-label">

                    이름

                </label>

                <div class="input-wrapper">

                    <input type="text"
                           id="nameInput"
                           name="name"
                           maxlength="20"
                           autocomplete="name"
                           placeholder="이름을 입력해주세요">

                    <button type="button"
                            id="clearButton"
                            class="clear-button"
                            aria-label="입력 내용 지우기">

                        ×

                    </button>

                </div>

                <p id="errorMessage"
                   class="error-message">
                </p>

                <div class="privacy-notice">

                    <span class="privacy-icon">
                        ✓
                    </span>

                    <p>
                        입력한 이름은 상담 화면에서 호칭으로 사용됩니다.
                    </p>

                </div>

                <button type="submit"
                        id="nextButton"
                        class="next-button"
                        disabled>

                    다음

                </button>

            </form>

        </section>

    </main>

    <div id="toast"
         class="toast"
         role="status"
         aria-live="polite">
    </div>

</div>

<script th:src="@{/js/saju-name.js}"
        src="/js/saju-name.js"></script>

</body>
</html>

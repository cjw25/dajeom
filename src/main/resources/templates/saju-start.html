<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#07101f">

  <title>AI 사주 상담 시작 - 다점</title>

  <link rel="stylesheet"
        th:href="@{/css/saju-start.css}"
        href="/css/saju-start.css">
</head>

<body>

<div class="saju-app">

  <header class="saju-header">

    <button type="button"
            class="header-control"
            id="backButton"
            aria-label="이전 화면">

            <span class="back-icon">
                ‹
            </span>

    </button>

    <h1>AI 사주</h1>

    <button type="button"
            class="header-control"
            id="homeButton"
            aria-label="홈으로 이동">

            <span class="home-icon">
                ⌂
            </span>

    </button>

  </header>

  <main class="saju-main">

    <section class="character-section">

      <img th:src="@{/img/saju-character.png}"
           src="/img/saju-character.png"
           class="character-image"
           alt="AI 사주 상담 캐릭터">

      <div class="character-overlay"></div>

      <div class="character-light"></div>

      <div class="character-profile">

                <span class="character-badge">
                    AI 사주 상담사
                </span>

        <h2>관상선생</h2>

        <p>
          사주팔자와 오행의 흐름을 바탕으로<br>
          당신의 타고난 기질과 운을 살펴드립니다.
        </p>

      </div>

    </section>

    <section class="speech-section">

      <div class="speech-bubble">

                <span class="speech-name">
                    관상선생
                </span>

        <p id="characterMessage">
          반갑습니다.<br>
          당신의 사주에 담긴 이야기를 함께 살펴보겠습니다.
        </p>

      </div>

    </section>

    <section class="guide-section">

      <h3>상담에 필요한 정보</h3>

      <div class="guide-list">

        <div class="guide-item">

                    <span class="guide-number">
                        1
                    </span>

          <div class="guide-information">

            <strong>이름</strong>

            <p>
              상담 중 불러드릴 이름을 입력합니다.
            </p>

          </div>

        </div>

        <div class="guide-item">

                    <span class="guide-number">
                        2
                    </span>

          <div class="guide-information">

            <strong>생년월일</strong>

            <p>
              양력 또는 음력 생년월일을 입력합니다.
            </p>

          </div>

        </div>

        <div class="guide-item">

                    <span class="guide-number">
                        3
                    </span>

          <div class="guide-information">

            <strong>출생시간</strong>

            <p>
              정확한 시간을 모르는 경우 모름을 선택할 수 있습니다.
            </p>

          </div>

        </div>

      </div>

    </section>

  </main>

  <footer class="start-footer">

    <button type="button"
            class="start-button"
            id="startButton">

      시작하기

    </button>

    <p>
      입력한 정보는 사주 분석을 위해 사용됩니다.
    </p>

  </footer>

</div>

<script th:src="@{/js/saju-start.js}"
        src="/js/saju-start.js"></script>

</body>
</html>
